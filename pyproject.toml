[project]
name = "visinterp"
version = "0.1.0"
description = "Mechanistic-interpretability experiments on the playmobil-dc-poses dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "pillow",
    "huggingface_hub",
    "transformers>=4.40",
    "tqdm",
]

[project.optional-dependencies]
dev = ["jupyterlab", "ipykernel", "nbconvert", "nbformat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visinterp"]
